<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#060b19" />
      <stop offset="60%" stop-color="#0a1128" />
      <stop offset="100%" stop-color="#101b3b" />
    </linearGradient>

    <!-- Floor Grid Pattern Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1329" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.15" />
    </linearGradient>

    <!-- Rack Frame Gradient -->
    <linearGradient id="rackFrame" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a233a" />
      <stop offset="20%" stop-color="#0d1322" />
      <stop offset="80%" stop-color="#0d1322" />
      <stop offset="100%" stop-color="#1a233a" />
    </linearGradient>

    <!-- Server Unit Metallic Gradient -->
    <linearGradient id="serverBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#212d4a" />
      <stop offset="100%" stop-color="#111828" />
    </linearGradient>

    <!-- Glass/Door Reflection Gradient -->
    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.15" />
      <stop offset="30%" stop-color="#00f0ff" stop-opacity="0.02" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="70%" stop-color="#7000ff" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowBlue" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Reusable Server Unit 1U -->
    <g id="server1U">
      <rect x="0" y="0" width="180" height="18" rx="2" fill="url(#serverBody)" stroke="#1e2c4d" stroke-width="1"/>
      <!-- Handles -->
      <rect x="4" y="3" width="4" height="12" rx="1" fill="#3a4b73"/>
      <rect x="172" y="3" width="4" height="12" rx="1" fill="#3a4b73"/>
      <!-- Drive Bays -->
      <rect x="14" y="3" width="24" height="12" rx="1" fill="#090d16" stroke="#152038" stroke-width="0.5"/>
      <rect x="41" y="3" width="24" height="12" rx="1" fill="#090d16" stroke="#152038" stroke-width="0.5"/>
      <rect x="68" y="3" width="24" height="12" rx="1" fill="#090d16" stroke="#152038" stroke-width="0.5"/>
      <rect x="95" y="3" width="24" height="12" rx="1" fill="#090d16" stroke="#152038" stroke-width="0.5"/>
      <!-- Status LEDs -->
      <circle cx="128" cy="9" r="1.5" fill="#00ff66" />
      <circle cx="134" cy="9" r="1.5" fill="#00f0ff" />
      <circle cx="140" cy="9" r="1" fill="#ffb700" />
      <!-- Ventilation Grid -->
      <path d="M148,5 h20 M148,9 h20 M148,13 h20" stroke="#1d2a45" stroke-width="1.5" stroke-dasharray="2,1"/>
    </g>

    <!-- Reusable Server Unit 2U (Storage/GPU) -->
    <g id="server2U">
      <rect x="0" y="0" width="180" height="40" rx="2" fill="url(#serverBody)" stroke="#1e2c4d" stroke-width="1"/>
      <!-- Handles -->
      <rect x="4" y="6" width="5" height="28" rx="1" fill="#3a4b73"/>
      <rect x="171" y="6" width="5" height="28" rx="1" fill="#3a4b73"/>
      <!-- Grid Drive Trays -->
      <path d="M15,6 h100 v28 h-100 z" fill="#080c14" stroke="#17233d" stroke-width="1"/>
      <path d="M15,13 h100 M15,20 h100 M15,27 h100" stroke="#17233d" stroke-width="1"/>
      <path d="M40,6 v28 M65,6 v28 M90,6 v28" stroke="#17233d" stroke-width="1"/>
      <!-- Drive Activity LEDs -->
      <circle cx="20" cy="10" r="1" fill="#00f0ff"/>
      <circle cx="45" cy="10" r="1" fill="#00f0ff"/>
      <circle cx="70" cy="10" r="1" fill="#00ff66"/>
      <circle cx="95" cy="10" r="1" fill="#00f0ff"/>
      <circle cx="20" cy="17" r="1" fill="#00f0ff"/>
      <circle cx="45" cy="17" r="1" fill="#ff0055"/>
      <circle cx="70" cy="17" r="1" fill="#00ff66"/>
      <circle cx="95" cy="17" r="1" fill="#00f0ff"/>
      <!-- Control Panel -->
      <rect x="122" y="6" width="44" height="28" rx="1" fill="#0d1526"/>
      <circle cx="132" cy="14" r="3" fill="#00f0ff" filter="url(#glowCyan)"/>
      <circle cx="132" cy="24" r="2" fill="#00ff66"/>
      <circle cx="142" cy="24" r="2" fill="#ffb700"/>
      <!-- Vent -->
      <path d="M152,10 v14 M156,10 v14 M160,10 v14" stroke="#253557" stroke-width="1.5"/>
    </g>

    <!-- Network Switch / Patch Panel -->
    <g id="networkSwitch">
      <rect x="0" y="0" width="180" height="22" rx="2" fill="#0f172a" stroke="#1e2c4d" stroke-width="1"/>
      <!-- Ports -->
      <path d="M12,6 h120 v10 h-120 z" fill="#05080f"/>
      <!-- Port Dividers (representing RJ45/SFP ports) -->
      <path d="M12,6 m6,0 v10 m6,0 v10 m6,0 v10 m6,0 v10 m6,0 v10 m6,0 v10 m6,0 v10 m6,0 v10 m6,0 v10 m6,0 v10 m6,0 v10 m6,0 v10 m6,0 v10 m6,0 v10 m6,0 v10 m6,0 v10" stroke="#1a2942" stroke-width="1"/>
      <!-- Activity Lights (Blinking effect visual) -->
      <path d="M15,4 h110" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="1,3" filter="url(#glowCyan)"/>
      <!-- Cable Management Bracket -->
      <rect x="140" y="4" width="32" height="14" rx="2" fill="none" stroke="#2a3c66" stroke-width="1.5"/>
    </g>

    <!-- Full Rack Assembly Pattern -->
    <g id="rackAssembly">
      <!-- Outer Frame Shadow/Glow -->
      <rect x="-4" y="-4" width="208" height="528" rx="6" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.2" filter="url(#glowCyan)"/>
      <!-- Main Cabinet Frame -->
      <rect x="0" y="0" width="200" height="520" rx="4" fill="url(#rackFrame)" stroke="#233354" stroke-width="2"/>
      <rect x="6" y="6" width="188" height="508" fill="#050811"/>
      
      <!-- Internal Mounting Rails -->
      <rect x="8" y="8" width="8" height="504" fill="#121b2d"/>
      <rect x="184" y="8" width="8" height="504" fill="#121b2d"/>

      <!-- Rack Units Stacked -->
      <g transform="translate(10, 12)">
        <!-- Top Unit: Fiber Patch Panel -->
        <use href="#networkSwitch" x="0" y="0"/>
        <use href="#networkSwitch" x="0" y="24"/>
        
        <!-- Main Compute Blade Servers -->
        <use href="#server1U" x="0" y="50"/>
        <use href="#server1U" x="0" y="70"/>
        <use href="#server1U" x="0" y="90"/>
        <use href="#server1U" x="0" y="110"/>
        
        <!-- High-Density Storage -->
        <use href="#server2U" x="0" y="132"/>
        <use href="#server2U" x="0" y="174"/>
        
        <!-- Middle Management Switches -->
        <use href="#networkSwitch" x="0" y="218"/>
        
        <!-- Compute Nodes -->
        <use href="#server1U" x="0" y="244"/>
        <use href="#server1U" x="0" y="264"/>
        <use href="#server1U" x="0" y="284"/>
        <use href="#server1U" x="0" y="304"/>
        <use href="#server1U" x="0" y="324"/>
        
        <!-- Main Storage / AI Accelerators -->
        <use href="#server2U" x="0" y="346"/>
        <use href="#server2U" x="0" y="388"/>
        
        <!-- UPS / Power Distribution Unit at Bottom -->
        <rect x="0" y="432" width="180" height="60" rx="2" fill="#0d1320" stroke="#1d2b47" stroke-width="1"/>
        <rect x="10" y="442" width="40" height="40" rx="2" fill="#05070d" stroke="#25375c"/>
        <circle cx="30" cy="462" r="10" fill="none" stroke="#00f0ff" stroke-width="2" filter="url(#glowCyan)"/>
        <path d="M30,457 v10 M25,462 h10" stroke="#00f0ff" stroke-width="1.5"/>
        <rect x="60" y="447" width="110" height="8" rx="1" fill="#141e33"/>
        <rect x="60" y="461" width="110" height="8" rx="1" fill="#141e33"/>
        <path d="M60,451 h60" stroke="#00ff66" stroke-width="2" stroke-dasharray="4,2"/>
        <path d="M60,465 h80" stroke="#00ff66" stroke-width="2" stroke-dasharray="3,2"/>
      </g>

      <!-- Glass Front Door Frame overlay with Reflection -->
      <rect x="4" y="4" width="192" height="512" rx="3" fill="url(#glassReflect)" stroke="#00f0ff" stroke-opacity="0.3" stroke-width="1"/>
      
      <!-- Door Handle & Lock -->
      <rect x="188" y="240" width="6" height="40" rx="2" fill="#2a3d66" stroke="#0f172a"/>
      <circle cx="191" cy="250" r="1.5" fill="#00f0ff"/>
      
      <!-- Cabinet Base/Casters -->
      <rect x="10" y="520" width="30" height="8" fill="#080d1a"/>
      <rect x="160" y="520" width="30" height="8" fill="#080d1a"/>
    </g>

    <!-- Overhead Cable Tray Unit -->
    <pattern id="cableTray" width="20" height="10" patternUnits="userSpaceOnUse">
      <path d="M 0 0 L 20 0 M 0 10 L 20 10 M 10 0 L 10 10" stroke="#1a294a" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="700" fill="url(#bgGrad)" />

  <!-- Central Ambient Light Glow (Data Centre Atmosphere) -->
  <circle cx="600" cy="280" r="450" fill="#00f0ff" opacity="0.04" filter="url(#glowBlue)" />
  <circle cx="600" cy="300" r="300" fill="#7000ff" opacity="0.03" filter="url(#glowBlue)" />

  <!-- Perspective Floor (Raised Floor Tiles) -->
  <g opacity="0.7">
    <!-- Isometric/Perspective Grid lines -->
    <path d="M-200,700 L450,480 M1400,700 L750,480" stroke="#00f0ff" stroke-opacity="0.2" stroke-width="1"/>
    <!-- Horizontal Tile Grid -->
    <path d="M 0,650 L 1200,650 M 0,600 L 1200,600 M 0,550 L 1200,550 M 0,510 L 1200,510 M 0,480 L 1200,480" stroke="#132447" stroke-width="1.5"/>
    <!-- Vertical Perspective Tile Lines -->
    <path d="M 100,700 L 480,480 M 300,700 L 530,480 M 500,700 L 580,480 M 700,700 L 620,480 M 900,700 L 670,480 M 1100,700 L 720,480" stroke="#132447" stroke-width="1.5"/>
    <!-- Under-floor Glow Highway (Hot/Cold Aisle Indicator) -->
    <polygon points="450,480 750,480 900,700 300,700" fill="url(#floorGrad)" />
  </g>

  <!-- Background Distance Racks (Depth Blur Effect) -->
  <g opacity="0.35" transform="scale(0.75) translate(280, 120)">
    <use href="#rackAssembly" x="100" y="100" />
    <use href="#rackAssembly" x="340" y="100" />
    <use href="#rackAssembly" x="580" y="100" />
    <use href="#rackAssembly" x="820" y="100" />
    <!-- Distance Ambient Glow -->
    <rect x="90" y="90" width="940" height="540" fill="#00f0ff" opacity="0.05" filter="url(#glowBlue)"/>
  </g>

  <g opacity="0.6" transform="scale(0.88) translate(80, 50)">
    <use href="#rackAssembly" x="80" y="80" />
    <use href="#rackAssembly" x="310" y="80" />
    <use href="#rackAssembly" x="540" y="80" />
    <use href="#rackAssembly" x="770" y="80" />
    <use href="#rackAssembly" x="1000" y="80" />
  </g>

  <!-- Overhead Cable Trays & Fiber Runners (Foreground Structural) -->
  <rect x="0" y="40" width="1200" height="20" fill="url(#cableTray)"/>
  <path d="M 0,50 L 1200,50" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.3" filter="url(#glowCyan)"/>
  <!-- Fiber Optic Cables Overhead -->
  <path d="M 0,43 Q 300,46 600,43 T 1200,43" fill="none" stroke="#ff0055" stroke-width="3" opacity="0.8"/>
  <path d="M 0,47 Q 400,43 800,48 T 1200,45" fill="none" stroke="#00f0ff" stroke-width="3" opacity="0.8"/>
  <path d="M 0,52 Q 200,55 500,50 T 1200,53" fill="none" stroke="#ffb700" stroke-width="2" opacity="0.8"/>

  <!-- Main Foreground Server Racks (Primary Focal Point) -->
  <g transform="translate(70, 110)">

    <!-- Rack 1 (Left) -->
    <g transform="translate(0, 0)">
      <use href="#rackAssembly" x="0" y="0"/>
      <!-- Drop Shadow on Floor -->
      <ellipse cx="100" cy="530" rx="110" ry="15" fill="#000000" opacity="0.6"/>
      <!-- Status Overlay Lighting -->
      <circle cx="100" cy="20" r="2" fill="#00f0ff" filter="url(#glowCyan)"/>
    </g>

    <!-- Rack 2 -->
    <g transform="translate(225, 0)">
      <use href="#rackAssembly" x="0" y="0"/>
      <ellipse cx="100" cy="530" rx="110" ry="15" fill="#000000" opacity="0.6"/>
      <!-- Cable Connections Down from Tray -->
      <path d="M100,-60 L100,0" stroke="#00f0ff" stroke-width="2" opacity="0.6" stroke-dasharray="4,2"/>
    </g>

    <!-- Rack 3 (Center - Master/Main Storage) -->
    <g transform="translate(450, 0)">
      <use href="#rackAssembly" x="0" y="0"/>
      <ellipse cx="100" cy="530" rx="110" ry="15" fill="#000000" opacity="0.6"/>
      <!-- Intense Cyan Glow for Center Rack (Active Focus) -->
      <rect x="-2" y="-2" width="204" height="524" rx="5" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.6" filter="url(#glowCyan)"/>
    </g>

    <!-- Rack 4 -->
    <g transform="translate(675, 0)">
      <use href="#rackAssembly" x="0" y="0"/>
      <ellipse cx="100" cy="530" rx="110" ry="15" fill="#000000" opacity="0.6"/>
      <path d="M100,-60 L100,0" stroke="#ff0055" stroke-width="2" opacity="0.4" stroke-dasharray="4,2"/>
    </g>

    <!-- Rack 5 (Right) -->
    <g transform="translate(900, 0)">
      <use href="#rackAssembly" x="0" y="0"/>
      <ellipse cx="100" cy="530" rx="110" ry="15" fill="#000000" opacity="0.6"/>
    </g>

  </g>

  <!-- Vertical Cable Drops to Racks -->
  <g stroke-width="2" opacity="0.5">
    <line x1="170" y1="60" x2="170" y2="110" stroke="#00f0ff"/>
    <line x1="395" y1="60" x2="395" y2="110" stroke="#ff0055"/>
    <line x1="620" y1="60" x2="620" y2="110" stroke="#00ff66"/>
    <line x1="845" y1="60" x2="845" y2="110" stroke="#00f0ff"/>
    <line x1="1070" y1="60" x2="1070" y2="110" stroke="#ffb700"/>
  </g>

  <!-- Foreground Data Particles / Digital Stream FX -->
  <g opacity="0.7">
    <!-- Cyan Stream -->
    <circle cx="280" cy="200" r="1.5" fill="#00f0ff" filter="url(#glowCyan)"/>
    <circle cx="280" cy="240" r="2" opacity="0.8" fill="#00f0ff" filter="url(#glowCyan)"/>
    <circle cx="280" cy="270" r="1" fill="#00f0ff"/>
    
    <!-- Magenta Stream (Data activity) -->
    <circle cx="730" cy="320" r="2" fill="#ff0055" filter="url(#glowCyan)"/>
    <circle cx="730" cy="350" r="1.5" fill="#ff0055"/>
    <circle cx="730" cy="390" r="2.5" fill="#ff0055" filter="url(#glowCyan)"/>

    <!-- Green Stream -->
    <circle cx="505" cy="180" r="2" fill="#00ff66" filter="url(#glowCyan)"/>
    <circle cx="505" cy="210" r="1" fill="#00ff66"/>
  </g>

  <!-- Front Lighting Overlay / Vignette (Pulls focus to center) -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
    <stop offset="60%" stop-color="#000000" stop-opacity="0" />
    <stop offset="100%" stop-color="#02040a" stop-opacity="0.7" />
  </radialGradient>
  <rect width="1200" height="700" fill="url(#vignette)" pointer-events="none"/>

  <!-- Server Room Environmental Glow Strip on Floor -->
  <path d="M0,680 L1200,680" stroke="#00f0ff" stroke-width="3" opacity="0.4" filter="url(#glowCyan)"/>
</svg>
